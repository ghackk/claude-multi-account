name: Platform compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Verify system Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash --version
          /bin/bash -n unix/claude-menu.sh unix/install.sh install.sh claude-usage-report.sh
      - name: Install packed npm package with scripts disabled
        shell: bash
        run: |
          npm pack --ignore-scripts
          npm install --global --ignore-scripts ./ghackk-multi-claude-*.tgz
          multi-claude --version
